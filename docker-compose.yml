services:
  # ---------------------------------------------------------
  # Initialize SQLite data directory permissions
  # www-data UID/GID in php:8.2-fpm-alpine = 82:82
  # ---------------------------------------------------------
  init-data:
    image: alpine:latest
    container_name: submonitor-init-data
    restart: "no"

    volumes:
      - ./data:/opt/SubMonitor/data

    command:
      - sh
      - -c
      - |
        set -eu

        DATA_DIR="/opt/SubMonitor/data"

        echo "[Init] Preparing SQLite data directory..."

        mkdir -p "$$DATA_DIR"

        # Application user in php:8.2-fpm-alpine
        chown -R 82:82 "$$DATA_DIR"

        # Directories: owner/group writable
        find "$$DATA_DIR" -type d -exec chmod 775 {} \;

        # SQLite database and sidecar files
        find "$$DATA_DIR" -type f \
          \( \
            -name "*.db" \
            -o -name "*.db-wal" \
            -o -name "*.db-shm" \
          \) \
          -exec chmod 664 {} \;

        echo "[Init] SQLite permissions initialized."

  # ---------------------------------------------------------
  # Import existing IP geo cache into SQLite
  # ip_cache.json -> SQLite ip_info
  # ---------------------------------------------------------
  ip-cache-sync:
    image: submonitor-php:latest

    container_name: submonitor-ip-cache-sync

    user: "82:82"

    restart: "no"

    depends_on:
      init-data:
        condition: service_completed_successfully

    command:
      - php
      - /opt/SubMonitor/bin/import_ip_cache.php

    volumes:
      # Import script
      - ./bin:/opt/SubMonitor/bin:ro

      # Database API
      - ./html:/opt/SubMonitor/html:ro

      # Existing cache: read-only
      - ./rules:/opt/SubMonitor/rules:ro

      # SQLite database: read/write
      - ./data:/opt/SubMonitor/data

    networks:
      - submonitor-net

  # ---------------------------------------------------------
  # PHP-FPM
  # ---------------------------------------------------------
  php:
    build:
      context: .
      dockerfile: Dockerfile

    image: submonitor-php:latest

    container_name: submonitor-php

    # www-data in php:8.2-fpm-alpine
    user: "82:82"

    restart: always

    depends_on:
      ip-cache-sync:
        condition: service_completed_successfully

    volumes:
      # Application source: read-only
      - ./html:/opt/SubMonitor/html:ro

      # Nginx configuration: read-only
      - ./nginx:/etc/nginx/conf.d:ro

      # Rules are read-only for PHP
      - ./rules:/opt/SubMonitor/rules:ro

      # SSL is read-only for PHP
      - ./ssl:/etc/nginx/ssl:ro

      # SQLite database: read/write
      - ./data:/opt/SubMonitor/data

    networks:
      - submonitor-net

  # ---------------------------------------------------------
  # Log importer
  # ---------------------------------------------------------
  log-importer:
    image: submonitor-php:latest

    container_name: submonitor-log-importer

    user: "82:82"

    restart: always

    depends_on:
      ip-cache-sync:
        condition: service_completed_successfully

    command:
      - php
      - /opt/SubMonitor/bin/log_importer.php

    volumes:
      # Application source: read-only
      - ./bin:/opt/SubMonitor/bin:ro
      - ./html:/opt/SubMonitor/html:ro

      # Rules are read-only
      - ./rules:/opt/SubMonitor/rules:ro

      # SQLite database: read/write
      - ./data:/opt/SubMonitor/data

    networks:
      - submonitor-net

  # ---------------------------------------------------------
  # Geo worker
  # ---------------------------------------------------------
  geo-worker:
    image: submonitor-php:latest

    container_name: submonitor-geo-worker

    user: "82:82"

    restart: always

    depends_on:
      ip-cache-sync:
        condition: service_completed_successfully

    command:
      - php
      - /opt/SubMonitor/bin/geo_worker.php

    volumes:
      # Application source: read-only
      - ./bin:/opt/SubMonitor/bin:ro
      - ./html:/opt/SubMonitor/html:ro

      # Geo worker needs to update ip_cache.json
      - ./rules:/opt/SubMonitor/rules

      # SQLite database: read/write
      - ./data:/opt/SubMonitor/data

    networks:
      - submonitor-net

  # ---------------------------------------------------------
  # Nginx
  # ---------------------------------------------------------
  nginx:
    image: nginx:alpine

    container_name: submonitor-nginx

    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Web files are read-only
      - ./html:/opt/SubMonitor/html:ro

      # Nginx configuration
      - ./nginx:/etc/nginx/conf.d

      # Runtime rules / ACME state
      - ./rules:/opt/SubMonitor/rules

      # SSL certificates
      - ./ssl:/etc/nginx/ssl

      # Initialization script
      - ./entrypoint.sh:/entrypoint.sh:ro

      # Nginx logs
      - log-data:/var/log/nginx

    depends_on:
      - php

    networks:
      - submonitor-net

    entrypoint:
      - /bin/sh
      - /entrypoint.sh

# -----------------------------------------------------------
# Persistent Nginx log volume
# -----------------------------------------------------------
volumes:
  log-data:

# -----------------------------------------------------------
# Network
# -----------------------------------------------------------
networks:
  submonitor-net:
    driver: bridge
    enable_ipv6: true

    ipam:
      config:
        - subnet: 172.30.0.0/16
        - subnet: 2001:db8:1::/64
