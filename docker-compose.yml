services:
  # ---------------------------------------------------------
  # Initialize SQLite data directory and Geo cache permissions
  # ---------------------------------------------------------
  init-data:
    image: alpine:latest
    container_name: submonitor-init-data
    restart: "no"

    volumes:
      - ./data:/opt/SubMonitor/data
      - ./rules:/opt/SubMonitor/rules

    command:
      - sh
      - -c
      - |
        set -eu

        DATA_DIR="/opt/SubMonitor/data"
        RULES_DIR="/opt/SubMonitor/rules"
        CACHE_FILE="$$RULES_DIR/ip_cache.json"

        echo "[Init] Preparing SQLite data directory..."

        mkdir -p "$$DATA_DIR"

        chown -R 82:82 "$$DATA_DIR"

        find "$$DATA_DIR" -type d -exec chmod 775 {} \;

        find "$$DATA_DIR" -type f \
          \( \
            -name "*.db" \
            -o -name "*.db-wal" \
            -o -name "*.db-shm" \
          \) \
          -exec chmod 664 {} \;

        echo "[Init] Preparing Geo cache..."

        mkdir -p "$$RULES_DIR"

        if [ -f "$$CACHE_FILE" ]; then
          chown 82:82 "$$CACHE_FILE"
          chmod 664 "$$CACHE_FILE"
        else
          touch "$$CACHE_FILE"
          chown 82:82 "$$CACHE_FILE"
          chmod 664 "$$CACHE_FILE"
        fi

        chown 82:82 "$$RULES_DIR"
        chmod 775 "$$RULES_DIR"

        echo "[Init] SQLite and Geo cache permissions initialized."


  # ---------------------------------------------------------
  # Import existing IP geo cache into SQLite
  # ---------------------------------------------------------
  ip-cache-sync:
    image: submonitor-php:latest

    container_name: submonitor-ip-cache-sync

    user: "82:82"

    restart: "no"

    depends_on:
      init-data:
        condition: service_completed_successfully

    command:
      - php
      - /opt/SubMonitor/bin/import_ip_cache.php

    volumes:
      - ./bin:/opt/SubMonitor/bin:ro
      - ./html:/opt/SubMonitor/html:ro
      - ./rules:/opt/SubMonitor/rules:ro
      - ./data:/opt/SubMonitor/data

    networks:
      - submonitor-net


  # ---------------------------------------------------------
  # PHP-FPM
  # ---------------------------------------------------------
  php:
    build:
      context: .
      dockerfile: Dockerfile

    image: submonitor-php:latest

    container_name: submonitor-php

    user: "82:82"

    restart: always

    depends_on:
      ip-cache-sync:
        condition: service_completed_successfully

    volumes:

      # PHP需要修改密码
      - ./html:/opt/SubMonitor/html

      # PHP需要修改nginx配置
      - ./nginx:/etc/nginx/conf.d

      # PHP需要写黑名单规则
      - ./rules:/opt/SubMonitor/rules

      # PHP申请SSL需要写入证书
      - ./ssl:/etc/nginx/ssl

      # SQLite
      - ./data:/opt/SubMonitor/data

    networks:
      - submonitor-net


  # ---------------------------------------------------------
  # Log importer
  # ---------------------------------------------------------
  log-importer:
    image: submonitor-php:latest

    container_name: submonitor-log-importer

    user: "82:82"

    restart: always

    depends_on:
      ip-cache-sync:
        condition: service_completed_successfully

    command:
      - php
      - /opt/SubMonitor/bin/log_importer.php

    volumes:
      - ./bin:/opt/SubMonitor/bin:ro
      - ./html:/opt/SubMonitor/html:ro
      - ./rules:/opt/SubMonitor/rules:ro
      - ./data:/opt/SubMonitor/data

    networks:
      - submonitor-net


  # ---------------------------------------------------------
  # Geo worker
  # ---------------------------------------------------------
  geo-worker:
    image: submonitor-php:latest

    container_name: submonitor-geo-worker

    user: "82:82"

    restart: always

    depends_on:
      ip-cache-sync:
        condition: service_completed_successfully

    command:
      - php
      - /opt/SubMonitor/bin/geo_worker.php

    volumes:
      - ./bin:/opt/SubMonitor/bin:ro
      - ./html:/opt/SubMonitor/html:ro
      - ./rules:/opt/SubMonitor/rules
      - ./data:/opt/SubMonitor/data

    networks:
      - submonitor-net


  # ---------------------------------------------------------
  # Nginx
  # ---------------------------------------------------------
  nginx:
    image: nginx:alpine

    container_name: submonitor-nginx

    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./html:/opt/SubMonitor/html:ro
      - ./nginx:/etc/nginx/conf.d
      - ./rules:/opt/SubMonitor/rules
      - ./ssl:/etc/nginx/ssl
      - ./entrypoint.sh:/entrypoint.sh:ro
      - log-data:/var/log/nginx

    depends_on:
      - php

    networks:
      - submonitor-net

    entrypoint:
      - /bin/sh
      - /entrypoint.sh


volumes:
  log-data:


networks:
  submonitor-net:
    driver: bridge
    enable_ipv6: true

    ipam:
      config:
        - subnet: 172.30.0.0/16
        - subnet: 2001:db8:1::/64
